<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR-генератор | Картографический инструмент</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      color: #1a1a2e;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      margin-top: 18px;
    }
    label:first-of-type { margin-top: 0; }

    input[type="number"], input[type="text"], select, textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.93rem;
      background: #f9fafb;
      color: #1a1a2e;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #4f46e5;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 64px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .info-badge {
      display: inline-block;
      font-size: 0.75rem;
      background: #eef2ff;
      color: #4338ca;
      border-radius: 6px;
      padding: 2px 8px;
      margin-top: 5px;
    }

    .btn-generate {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-generate:hover { background: #4338ca; }

    .result-section {
      margin-top: 32px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .result-section.visible { display: flex; }

    #qr-output svg {
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(79,70,229,0.12);
    }

    .stats-box {
      background: #f5f3ff;
      border: 1.5px solid #c4b5fd;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 0.83rem;
      color: #3730a3;
      width: 100%;
    }
    .stats-box b { color: #1a1a2e; }

    .btn-download {
      padding: 10px 28px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-download:hover { background: #059669; }

    .ec-desc { font-size: 0.78rem; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
<div class="card">
  <h1>🗺 QR-генератор</h1>
  <p class="subtitle">Инструмент для картографических QR-кодов</p>

  <label for="data-input">Данные для кодирования</label>
  <textarea id="data-input" placeholder="Введите URL или текст…" rows="2"></textarea>
  <span class="info-badge" id="char-count">0 символов</span>

  <div class="row-2">
    <div>
      <label for="ec-level">Уровень коррекции ошибок</label>
      <select id="ec-level">
        <option value="L">L — 7%</option>
        <option value="M" selected>M — 15%</option>
        <option value="Q">Q — 25%</option>
        <option value="H">H — 30%</option>
      </select>
      <div class="ec-desc" id="ec-desc">Стандартный. Подходит для большинства карт.</div>
    </div>
    <div>
      <label for="qr-size">Размер (px)</label>
      <input type="number" id="qr-size" value="256" min="64" max="1024" step="16"/>
    </div>
  </div>

  <button class="btn-generate" onclick="generate()">Сгенерировать QR-код</button>

  <div class="result-section" id="result">
    <div id="qr-output"></div>
    <div class="stats-box" id="stats"></div>
    <button class="btn-download" onclick="downloadSVG()">⬇ Скачать SVG</button>
  </div>
</div>

<!-- Nayuki QR Code generator (MIT) -->
<script src="https://cdn.jsdelivr.net/npm/qrcodegen@1.8.0/qrcodegen.min.js"></script>
<script>
  const ecDescriptions = {
    L: "Минимальная (7%). Максимальная ёмкость. Для чистых условий печати.",
    M: "Стандартный (15%). Подходит для большинства карт.",
    Q: "Повышенная (25%). Рекомендуется для карт с загрузкой фона.",
    H: "Максимальная (30%). Для карт с высокой графической нагрузкой."
  };

  document.getElementById('data-input').addEventListener('input', function() {
    document.getElementById('char-count').textContent = this.value.length + ' символов';
  });

  document.getElementById('ec-level').addEventListener('change', function() {
    document.getElementById('ec-desc').textContent = ecDescriptions[this.value];
  });

  function getEcl(level) {
    const QRC = qrcodegen.QrCode;
    return { L: QRC.Ecc.LOW, M: QRC.Ecc.MEDIUM, Q: QRC.Ecc.QUARTILE, H: QRC.Ecc.HIGH }[level];
  }

  function generate() {
    const text = document.getElementById('data-input').value.trim();
    if (!text) { alert('Введите данные для кодирования.'); return; }

    const ecLevel = document.getElementById('ec-level').value;
    const size = parseInt(document.getElementById('qr-size').value) || 256;

    const qr = qrcodegen.QrCode.encodeText(text, getEcl(ecLevel));
    const svgStr = toSvgString(qr, size);

    const out = document.getElementById('qr-output');
    out.innerHTML = svgStr;

    const modules = qr.size;
    const version = qr.version;
    const ecNames = {L:'L (7%)', M:'M (15%)', Q:'Q (25%)', H:'H (30%)'};

    document.getElementById('stats').innerHTML =
      `<b>Версия QR:</b> ${version} &nbsp;|&nbsp; <b>Модулей:</b> ${modules}×${modules}<br>
       <b>Коррекция:</b> ${ecNames[ecLevel]} &nbsp;|&nbsp; <b>Символов:</b> ${text.length}<br>
       <b>Размер вывода:</b> ${size}×${size} px &nbsp;|&nbsp;
       <b>Размер модуля:</b> ${(size / modules).toFixed(1)} px`;

    document.getElementById('result').classList.add('visible');
  }

  function toSvgString(qr, sizePx) {
    const modules = qr.size;
    const pad = 4;
    const total = modules + pad * 2;
    const cell = sizePx / total;
    let rects = '';
    for (let y = 0; y < modules; y++) {
      for (let x = 0; x < modules; x++) {
        if (qr.getModule(x, y)) {
          const px = ((x + pad) * cell).toFixed(2);
          const py = ((y + pad) * cell).toFixed(2);
          const cs = cell.toFixed(2);
          rects += `<rect x="${px}" y="${py}" width="${cs}" height="${cs}" fill="#1a1a2e"/>`;
        }
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${sizePx}" height="${sizePx}" viewBox="0 0 ${sizePx} ${sizePx}">
      <rect width="${sizePx}" height="${sizePx}" fill="#ffffff"/>
      ${rects}
    </svg>`;
  }

  function downloadSVG() {
    const svg = document.querySelector('#qr-output svg');
    if (!svg) return;
    const blob = new Blob([svg.outerHTML], {type: 'image/svg+xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qrcode.svg';
    a.click();
  }
</script>
</body>
</html>
